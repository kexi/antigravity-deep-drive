      wheelFR: "Wheel_FR"
      wheelRL: "Wheel_RL"
      wheelRR: "Wheel_RR"
      windshield: "Windshield_Glass"
      wiperL: "Wiper_Left"
      wiperR: "Wiper_Right"
      headlightL: "Headlight_Left"
      headlightR: "Headlight_Right"
